<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6edf7">
<meta name="description" content="Um álbum de fotos feito com carinho pra Lavínia.">
<title>Os dias mais bonitos · Lavínia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:#39243e;background:radial-gradient(ellipse at 20% 4%,#f9dce6,transparent 34rem),radial-gradient(ellipse at 100% 42%,#e9dcf7,transparent 40rem),#f9f1f6;font:1rem/1.6 'DM Sans',sans-serif}
button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #803d7a;outline-offset:5px}
.wrap{width:min(1120px,calc(100% - 48px));margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid #59355b29}.brand{font-weight:700;text-decoration:none}.brand span{color:#914679;margin-right:7px}header a:last-child{font-weight:600;text-underline-offset:5px}
.hero{display:grid;grid-template-columns:1fr .8fr;align-items:center;gap:clamp(24px,7vw,104px);min-height:580px;padding:64px 0 76px}.hero-copy{animation:appear .7s ease-out both}h1,h2{font:600 clamp(3.5rem,7.8vw,7rem)/.98 'Playfair Display',Georgia,serif;letter-spacing:-.065em;margin:0 0 24px}em{color:#803d7a}h2{font-size:clamp(2.7rem,5.4vw,5rem)}p{margin:0 0 22px}.hero p{font-size:1.14rem;max-width:32ch}.pill{display:inline-block;background:#643366;color:white;border:0;border-radius:99px;padding:12px 22px;text-decoration:none;font-weight:700}.pill:hover{background:#4d254f}
.cover{position:relative;width:min(100%,370px);margin:auto;isolation:isolate}.cover::before{content:'';position:absolute;inset:3% 0 1%;background:#dcbeda;border:1px solid #fff;border-radius:4px;transform:rotate(10deg);box-shadow:0 16px 36px #56305222;z-index:-1}.cover figure{margin:0;padding:13px 13px 14px;background:#fffbf8;box-shadow:0 20px 45px #5630522d;transform:rotate(-6deg);border-radius:4px}.cover-photo{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#ebd4e7}.cover figcaption{text-align:center;padding-top:10px;font:italic 600 1.3rem 'Playfair Display',Georgia,serif;color:#803d7a}
.album{padding:65px 0 75px;border-top:1px solid #59355b29;scroll-margin-top:18px}.album-head{text-align:center}.album-head p{color:#664e68}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 28px;padding:16px 6px}.polaroid{display:block;width:100%;padding:10px 10px 12px;background:#fffbf8;border:0;border-radius:4px;box-shadow:0 12px 28px #56305222;transform:rotate(var(--tilt));transition:transform .3s,box-shadow .3s;position:relative}.polaroid:hover,.polaroid:focus-visible{z-index:1;transform:translateY(-7px) rotate(0);box-shadow:0 22px 38px #56305231}.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#ebd4e7}.polaroid span{display:block;color:#803d7a;font-size:1.3rem;padding-top:5px}.tile{min-width:0;animation:appear .55s ease-out both;animation-delay:var(--delay)}.tile:nth-child(3n+1){--tilt:-3deg}.tile:nth-child(3n+2){--tilt:2deg}.tile:nth-child(3n){--tilt:-1deg}
#status{text-align:center}footer{text-align:center;padding:30px 0 42px;border-top:1px solid #59355b29;font:italic 600 1.3rem 'Playfair Display',Georgia,serif;color:#803d7a}dialog{border:0;border-radius:18px;padding:12px;background:#fffbf8;color:#39243e;width:max-content;max-width:calc(100% - 24px);box-shadow:0 24px 90px #22102466}dialog::backdrop{background:#28142bdb}dialog img{display:block;max-width:min(82vw,760px);height: min(65svh,620px);object-fit:contain;margin:auto}.controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 0 0;flex-wrap:wrap}.controls button,.retry{background:#f2e2f0;border:0;border-radius:99px;padding:8px 13px;font-weight:700}.controls button:hover,.retry:hover{background:#e8cce4}
@keyframes appear{from{opacity:0;transform:translateY(19px)}to{opacity:1;transform:translateY(0)}}@media(max-width:720px){.hero{grid-template-columns:1fr;gap:42px;padding:50px 0 62px;min-height:0}.cover{width:min(77%,290px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 13px}.album{padding:46px 0}.wrap{width:calc(100% - 34px)}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="#inicio"><span aria-hidden="true">♥</span> Pra Lavínia</a><a href="#album">Fotos</a></header>
<main id="inicio">
<section class="hero" aria-labelledby="title">
<div class="hero-copy"><h1 id="title">Os dias mais <em>bonitos</em></h1><p>Um álbum pra você, Lavínia. Pra abrir sempre que der vontade de sorrir um pouquinho.</p><a class="pill" href="#album">Ver as fotos</a></div>
<div class="cover"><figure><div id="cover-image" class="cover-photo" aria-hidden="true"></div><figcaption>Minha Lavínia ♡</figcaption></figure></div>
</section>
<section id="album" class="album" aria-labelledby="album-title"><div class="album-head"><h2 id="album-title">Meu álbum <em>favorito</em></h2><p>Toque numa foto pra ver de pertinho.</p></div><p id="status" role="status">Carregando fotos…</p><div class="grid" id="photos"></div></section>
</main>
<footer>Com carinho, pra você. ♡</footer>
</div>
<dialog id="viewer" aria-label="Foto ampliada"><img id="large-photo" alt=""><div class="controls"><button id="previous" type="button">Anterior</button><span id="count" aria-live="polite"></span><button id="next" type="button">Próxima</button><form method="dialog"><button>Fechar</button></form></div></dialog>
<script>
const grid = document.querySelector('#photos')
const status = document.querySelector('#status')
const dialog = document.querySelector('#viewer')
const large = document.querySelector('#large-photo')
const count = document.querySelector('#count')
let photos = []
let active = 0

function showPhoto(index) {
  active = (index + photos.length) % photos.length
  large.src = photos[active]
  large.alt = 'Foto ' + (active + 1) + ' da Lavínia'
  count.textContent = (active + 1) + ' / ' + photos.length
}

async function loadPhotos() {
  status.textContent = 'Carregando fotos…'
  try {
    const response = await fetch("WhatsApp%20Unknown%202026-11-20%20at%2014.00.54.zip")
    if (!response.ok) throw new Error('Arquivo indisponível')
    const archive = await response.arrayBuffer()
    const view = new DataView(archive)
    const pictures = []
    // As fotos deste ZIP foram armazenadas sem compressão.
    for (let offset = 0; offset + 30 <= view.byteLength && view.getUint32(offset, true) === 0x04034b50;) {
      const size = view.getUint32(offset + 18, true)
      const start = offset + 30 + view.getUint16(offset + 26, true) + view.getUint16(offset + 28, true)
      const end = start + size
      if (end > view.byteLength) throw new Error('Arquivo incompleto')
      if (view.getUint16(offset + 8, true) === 0 && size >= 4 && view.getUint16(start) === 0xffd8) {
        pictures.push(archive.slice(start, end))
      }
      offset = end
    }
    if (!pictures.length) throw new Error('Nenhuma foto encontrada')
    photos = pictures.map(bytes => URL.createObjectURL(new Blob([bytes], {type:'image/jpeg'})))
    if (photos[1]) {
      const favicon = document.createElement('link')
      favicon.rel = 'icon'
      favicon.type = 'image/jpeg'
      favicon.href = photos[1]
      document.head.append(favicon)
    }
    const cover = document.createElement('img')
    cover.className = 'cover-photo'
    cover.src = photos[0]
    cover.alt = 'Lavínia, na foto de capa'
    document.querySelector('#cover-image').replaceWith(cover)
    photos.forEach((src, index) => {
      const tile = document.createElement('div')
      const button = document.createElement('button')
      const img = document.createElement('img')
      const heart = document.createElement('span')
      tile.className = 'tile'
      tile.style.setProperty('--delay', (index * 55) + 'ms')
      button.className = 'polaroid'
      button.type = 'button'
      button.setAttribute('aria-label', 'Ampliar foto ' + (index + 1))
      img.src = src
      img.alt = 'Foto ' + (index + 1) + ' da Lavínia'
      img.loading = 'lazy'
      img.decoding = 'async'
      heart.textContent = '♡'
      heart.setAttribute('aria-hidden', 'true')
      button.append(img, heart)
      button.addEventListener('click', () => { showPhoto(index); dialog.showModal() })
      tile.append(button)
      grid.append(tile)
    })
    status.textContent = ''
    status.hidden = true
  } catch {
    status.textContent = 'As fotos não carregaram. '
    const retry = document.createElement('button')
    retry.type = 'button'
    retry.className = 'retry'
    retry.textContent = 'Tentar de novo'
    retry.addEventListener('click', loadPhotos)
    status.append(retry)
  }
}

document.querySelector('#previous').addEventListener('click', () => showPhoto(active - 1))
document.querySelector('#next').addEventListener('click', () => showPhoto(active + 1))
dialog.addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') showPhoto(active - 1)
  if (event.key === 'ArrowRight') showPhoto(active + 1)
})
dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close() })
loadPhotos()
</script>
</body>
</html>
